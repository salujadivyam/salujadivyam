
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#183D2B"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#183D2B"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep">
      <stop offset="0%" stop-color="#183D2B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#86EFAC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#183D2B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typing">
      <rect x="0" y="-48" width="0" height="62">
        <animate attributeName="width" from="0" to="365" dur="2.2s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="110" y="15" width="780" height="8" rx="4" fill="#183D2B"/>
  <rect x="110" y="15" width="780" height="8" rx="4" fill="url(#banner)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="110" y="15" width="180" height="8" rx="4" fill="url(#sweep)">
    <animate attributeName="x" values="110;710;110" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="62" fill="#86EFAC" font-family="monospace" font-size="15" letter-spacing="3" text-anchor="middle">AI/ML · CLOUD &amp; DEVOPS · SYSTEM DESIGN · SOFTWARE ENGINEERING</text>

  <g transform="translate(285 120)">
    <text x="0" y="0" fill="#4ADE80" font-family="monospace" font-size="43" font-weight="700" clip-path="url(#typing)">Divyam Saluja</text>
    <rect x="0" y="-43" width="3" height="49" fill="#4ADE80">
      <animate attributeName="x" values="0;0;365;365" keyTimes="0;0.05;0.9;1" dur="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="500" y="157" fill="#C9D1D9" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Computer Science Engineering | MIT Bengaluru</text>

  <rect x="300" y="177" width="400" height="2" rx="1" fill="#183D2B"/>
  <rect x="300" y="177" width="90" height="2" rx="1" fill="#4ADE80">
    <animate attributeName="x" values="300;610;300" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
